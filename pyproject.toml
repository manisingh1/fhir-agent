[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-agent"
version = "0.1.0"
description = "Read-only Epic FHIR R4 sandbox client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyJWT[crypto]>=2.10,<3", "requests>=2.32,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
aws = ["boto3>=1.38,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
fhir-agent = "fhir_agent.cli:main"

[tool.setuptools.packages.find]
include = ["fhir_agent*"]
