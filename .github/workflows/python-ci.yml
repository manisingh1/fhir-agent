name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Fork PRs run untrusted code: no secrets, deployment credentials, or write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install client and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m pytest -q

  package:
    name: Build and install package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Install built wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/fhir-wheel-test"
          "$RUNNER_TEMP/fhir-wheel-test/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/fhir-wheel-test/bin/python" -m pip check
      - name: Smoke-test the installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/fhir-wheel-test/bin/python" -c 'from fhir_agent import FHIRClient, BackendAuth, ClinicalClient, Settings'
          "$RUNNER_TEMP/fhir-wheel-test/bin/fhir-agent" --help
