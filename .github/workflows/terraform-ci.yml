name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_EC2_METADATA_DISABLED: "true"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform 1.14.0 (minimum supported)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate
        run: |
          for root in infra/bootstrap infra/modules/epic-auth infra/examples/sandbox; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Test with mocked AWS provider
        run: |
          terraform -chdir=infra/bootstrap test
          terraform -chdir=infra/modules/epic-auth test
          terraform -chdir=infra/examples/sandbox test
      - name: Verify retained key deletion is blocked
        run: python3 scripts/test_key_retention.py
